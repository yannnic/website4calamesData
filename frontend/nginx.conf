server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API FastAPI, servie sous /api (même origine que le frontend)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # /nlsearch et /summarize appellent un LLM
        client_max_body_size 25m;  # dépôt de fichiers EAD (MAX_UPLOAD_MB côté API)
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
