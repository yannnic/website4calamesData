server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker : résolution de "api" à chaque requête (valable 10 s), sinon
    # nginx garde l'IP du démarrage et renvoie 502 après un redémarrage de l'API.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API FastAPI, servie sous /api (même origine que le frontend)
    location /api/ {
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # /nlsearch et /summarize appellent un LLM
        client_max_body_size 25m;  # dépôt de fichiers EAD (MAX_UPLOAD_MB côté API)
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
