# Déploiement de démonstration — voir DEPLOY.md
#
#   cp .env.example .env   # puis renseigner les secrets
#   docker compose up -d --build
#
# Seul le frontend (nginx) est exposé ; il relaie /api vers FastAPI.

services:

  # Nœud unique, non exposé ; authentification par mot de passe (utilisateur elastic).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    volumes:
      - es_data:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?définir ELASTIC_PASSWORD dans .env}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Surveille le dossier EAD : indexe les fichiers nouveaux/modifiés,
  # retire de l'index les fichiers supprimés.
  watcher:
    build: ./backend
    command: python indexer/watcher.py
    volumes:
      - ${EAD_DIR:-ead_data}:/data/ead
      - ./demo/seed:/seed:ro
      - watcher_state:/state
    environment:
      EAD_DIR: /data/ead
      SEED_DIR: /seed
      STATE_FILE: /state/watcher.json
      ES_HOST: http://elasticsearch:9200
      ES_PASSWORD: ${ELASTIC_PASSWORD}
      ES_INDEX: ead_components
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Moissonnage OAI-PMH → dossier EAD (le watcher indexe ensuite les fichiers).
  # Optionnel : docker compose --profile harvest up -d
  #         ou : docker compose run --rm harvester   (une passe)
  harvester:
    build: ./backend
    profiles: ["harvest"]
    command: python harvester/harvester.py --out /data/ead --state /state/harvester.json --incremental
    volumes:
      - ${EAD_DIR:-ead_data}:/data/ead
      - watcher_state:/state
    environment:
      OAI_URL: ${OAI_URL:-}
      HARVEST_SETS: ${HARVEST_SETS:-}
      HARVEST_LIMIT: ${HARVEST_LIMIT:-}
      HARVEST_DELAY: ${HARVEST_DELAY:-2}
      HARVEST_EVERY_HOURS: ${HARVEST_EVERY_HOURS:-24}
      PYTHONUNBUFFERED: "1"
    restart: on-failure

  api:
    build: ./backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --root-path /api --proxy-headers --forwarded-allow-ips="*"
    volumes:
      - ${EAD_DIR:-ead_data}:/data/ead
      - watcher_state:/state:ro
      # Corpus de test (?corpus=test), indexé au démarrage de l'API
      - ./data/test:/data/test:ro
    environment:
      ES_HOST: http://elasticsearch:9200
      ES_PASSWORD: ${ELASTIC_PASSWORD}
      ES_INDEX: ead_components
      DATA_DIR: /data/ead
      STATE_FILE: /state/watcher.json
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      NL_LLM_BASE_URL: ${NL_LLM_BASE_URL:-}
      NL_LLM_API_KEY: ${NL_LLM_API_KEY:-}
      NL_LLM_MODEL: ${NL_LLM_MODEL:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  es_data:
  ead_data:
  watcher_state:
